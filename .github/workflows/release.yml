name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run build && npm run verify
      - run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" && test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./server.json').version")" && grep -qF "VERSION = '${GITHUB_REF_NAME#v}'" mcp/src/version.ts
      - run: npm install -g npm@11.21.1
      - run: npm stage publish --provenance --access public
